<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Board (Table)</title>
  <style>
    table {
      border: 2px solid black;
      border-collapse: collapse;
    }

    td {
      width: 50px;
      height: 50px;
    }

    .white {
      background-color: white;
    }
    .white:hover{
      background-color: black;
    }
   .black {
      background-color: black;
    }
    .black:hover{
      background-color: white;
    }
  </style>
</head>
<body>

  <h2>Chess Board</h2>
  <table>
    <!-- Row 1 -->
    <tr>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
    </tr>
    <!-- Row 2 -->
    <tr>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
    </tr>
    <!-- Row 3 -->
    <tr>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
    </tr>
    <!-- Row 4 -->
    <tr>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
    </tr>
    <!-- Row 5 -->
    <tr>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
    </tr>
    <!-- Row 6 -->
    <tr>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
    </tr>
    <!-- Row 7 -->
    <tr>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
    </tr>
    <!-- Row 8 -->
    <tr>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
      <td class="black"></td>
      <td class="white"></td>
    </tr>
  </table>
</body>
</html>
