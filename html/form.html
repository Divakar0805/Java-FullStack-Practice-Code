<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="username" >Username :</label>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="email">Email :</label>
        <input type="text" id="email" name="email">
        <br><br>
        <label for="x">Password :</label>
        <input type="password" id="x" name="password">
        <br><br>
        <label for="Phoneno">Phoneno :</label>
        <input type="tel" id="phone" name="Phoneno">
        <br><br>
        <label for="age">age :</label>
        <input type="number" id="age" name="age">
        <br><br>
        <label for="">Gender</label>
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female
        <input type="radio" name="Gender" value="Others">Others
        <br><br>
        <label for="dateOfBirth">Date of birth :</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth">
        <br><br>
        <label for="address">Address :</label>
        <textarea id="address" rows="10" cols="80" name="address"></textarea>
        <br><br>
        <label for="resume">Resume :</label>
        <input type="file" name="resume" id="resume">
        <br><br>
        <label for="Location">Location :</label>
        <input type="url" name="Location" id="Location">
        <br><br>
        <label for="">Language :</label>
        <select>
            <option disabled selected value="" hidden>Select Language</option>
            <optgroup label="south india">
            <option>Tamil</option>
            <option>Telugu</option>
            <option>Malayalam</option>
            <option>Kanadam</option>
            </optgroup>
            <optgroup label="north india">
                <option>Hindi</option>
                <option>Urdu</option>
                <option>Punjabi</option>
                <option>Haryanvi</option>
            </optgroup>
        </select>
        <br><br>
        <label for="">Skills</label>
        <input type="checkbox" name="Skills" value="Webtech">Webtech
        <input type="checkbox" name="Skills" value="Java">Java
        <input type="checkbox" name="Skills" value="Python">Python
        <input type="checkbox" name="Skills" value="SQL">SQL
        <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
