<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background-color:#f2f4f7;  
        }
        section{
            height: 350px;
            width: 400px;
            background:rgb(255,255,255);
            border-radius: 3%;
            position: relative;   
            left: 850px;
            box-shadow: 0px 0px 5px 0px rgb(179, 176, 176) ;
        }
        #email{
            height: 50px;
            width: 350px;
            padding: 10px;
            border-radius: 3px;
            margin-top: 20px;
            margin-left: 25px;
            border: 2px solid rgb(233,225,228);
            font-size: 1rem;
        }
        #pass{
            height: 50px;
            width: 350px;
            padding: 10px;
            border-radius: 3px;
            margin-top: 15px;
            margin-left: 25px;
            border: 2px solid rgb(233,225,228);
            font-size: 1rem;
        }
        .login{
            height: 50px;
            width: 350px;
            border: none;
            border-radius: 3px;
            font-size: 1.3rem;
            color: white;
            margin-top: 20px;
            margin-left: 25px;
            background-color: #1877f2;
            font-weight: 700;
        }
        .forgot{
            margin-top: 10px;
            margin-left: 140px;
            color:#1877f2;
        }
        .new{
            height: 40px;
            width: 200px;
            margin-top: 50px;
            margin-left: 100px;
            border: none;
            background-color: #36A420;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 3px;
        }
        .fotter{
            margin-left: 900px;
            margin-top: 30px;
        }
        #left{
            position: relative;
            top: 200px;
            margin-left:280px;
        }
        h2{
            font-size: 3.6rem;
            font-weight: 700;
            color: #0866ff;
            margin-bottom: 10px;
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
        }
        .para{
            font-size: 1.7rem;
            font-family: Helvetica,Arial,sans-serif;
        }
    
       

    </style>
</head>
<body>
        <div id="left">
            <h2>facebook</h2> 
            <p class="para">Facebook helps you connect and share <br>with the people in your life.</p>   
        </div>
        <section>
            <div id="first">
                <form action=""><label for="email"><input id="email" type="text" placeholder="Email address or phone number"></label></form>
            </div>
            <div id="second">
                <form action=""><label for="pass"><input id="pass" type="password" placeholder="Password"></label></form>
            </div>
            <button class="login">Log In</button>
            <div class="forgot">
                <span>Forgotten password </span>
            </div>
            <button class="new">Create new account</button>
        </section>
        <p class="fotter"><b>Create a Page</b> for a celebrity, brand or business </p>
</body>
</html>
