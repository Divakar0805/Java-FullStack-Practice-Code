<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        section{
            height: 500px;
            width: 500px;
            border: 2px solid black;
        }
        div{
            height: 80px;
            width: 80px;
        }
        div:nth-child(1){
            background-color: aqua;
    
        }
        div:nth-child(2){
            background-color: darkblue;
        }
        div:nth-child(3){
            background-color: red;
        }
        div:nth-child(4){
            background-color: gold;
        }
        div:nth-child(5){
            background-color: orange;
        }
        div:nth-child(6){
            background-color: green;
        }
        div:nth-child(7){
            background-color: brown;
        }
        div:nth-child(8){
            background-color: pink;
        }
        div:nth-child(9){
            background-color: violet;
        }

    </style>
</head>
<body>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </section> 
</body>
</html>
