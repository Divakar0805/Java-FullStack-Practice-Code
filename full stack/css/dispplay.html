<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            height: 700px;
            width: 1200px;
            border: 4px solid black;
            display:flex;
            justify-content: start;
            align-items: center;    
            flex-direction:row;
            align-items:start;
            /* row-gap: 20px;
            column-gap: 20px; */
            gap: 50px;
            flex-wrap: wrap;
            flex-flow: column wrap;
            align-content:start;
          }
        div{
            height: 100px;
            width: 100px;
            font-size: 3rem;
            border: solid;
        }
        
        main div:nth-child(1){
            background-color: aqua;
        }
        main div:nth-child(2){
            background-color: antiquewhite;
        }
        main div:nth-child(3){
            background-color: bisque;
        }
        main div:nth-child(4){
            background-color: tomato;
        }
        main div:nth-child(5){
            background-color: gray;
            order: 1;
            align-self: 4;
            align-items: end;
        }
    </style>
</head>
<body>
    <main>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
    </main>
</body>
</html>
