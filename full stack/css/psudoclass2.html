<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*unvisited*/
        a:link{
            color: brown;
        }
        /*active*/
        a:active{
            color: aqua;
        }
        /*visited*/
        a:visited{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <a href="https://in.pinterest.com/">Pinterest</a>
</body>
</html>
